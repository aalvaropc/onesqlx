name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        Describe the situation, not the solution. Understanding the underlying
        need often leads to a better answer than the one first imagined.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like OneSQLx to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: How do you handle this today, here or in another tool?
